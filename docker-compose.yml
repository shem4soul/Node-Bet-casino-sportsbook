# Local / single-host stack: PostgreSQL + one-shot migrator + API + worker.
#
#   cp .env.example .env      # fill in secrets
#   docker compose up --build
#
# API:  http://localhost:4000   Docs: http://localhost:4000/docs
name: sportsbook

x-app: &app
  build: .
  image: ${IMAGE:-sportsbook-api:local}
  env_file: .env
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER:-sportsbook}:${POSTGRES_PASSWORD:-sportsbook}@db:5432/${POSTGRES_DB:-sportsbook}
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sportsbook}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportsbook}
      POSTGRES_DB: ${POSTGRES_DB:-sportsbook}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ['sh', '-c', 'node dist/db/migrate.js && node dist/db/seed.js']
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    command: ['node', 'dist/server.js']
    ports:
      - '${PORT:-4000}:4000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sportsbook}:${POSTGRES_PASSWORD:-sportsbook}@db:5432/${POSTGRES_DB:-sportsbook}
      PORT: 4000
      RUN_JOBS_IN_API: 'false'
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ['node', 'dist/worker.js']
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
