name: CD

# Builds and publishes the image to GitHub Container Registry, then deploys:
#   push to main  -> :main + :sha-<short>   -> staging   (if configured)
#   tag v1.2.3    -> :1.2.3 + :1.2 + :latest -> production (requires approval
#                                              via the "production" environment)
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: out
        run: echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD)" | tr '[:upper:]' '[:lower:]' >> "$GITHUB_OUTPUT"

  deploy-staging:
    name: Deploy to staging
    needs: publish
    if: github.ref == 'refs/heads/main' && vars.STAGING_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml,deploy/Caddyfile
          target: ${{ vars.DEPLOY_PATH || '/opt/sportsbook' }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.STAGING_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/sportsbook' }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE=${{ needs.publish.outputs.image }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
      - name: Verify
        if: vars.STAGING_URL != ''
        run: |
          for i in $(seq 1 20); do curl -fsS "${{ vars.STAGING_URL }}/ready" && exit 0; sleep 6; done; exit 1

  deploy-production:
    name: Deploy to production
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v') && vars.PRODUCTION_HOST != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Copy compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml,docker-compose.prod.yml,deploy/Caddyfile
          target: ${{ vars.DEPLOY_PATH || '/opt/sportsbook' }}
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.PRODUCTION_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd ${{ vars.DEPLOY_PATH || '/opt/sportsbook' }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE=${{ needs.publish.outputs.image }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
      - name: Verify
        if: vars.PRODUCTION_URL != ''
        run: |
          for i in $(seq 1 20); do curl -fsS "${{ vars.PRODUCTION_URL }}/ready" && exit 0; sleep 6; done; exit 1
