        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: '`CASHOUT_UNAVAILABLE` or `CASHOUT_CHANGED` (value below expectedAmount)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /sports/booking-codes:
    post:
      tags: [Bets]
