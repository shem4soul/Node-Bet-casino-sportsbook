  # ======================================================================== Webhooks
  /webhooks/paystack:
    post:
      tags: [Webhooks]
      operationId: paystackWebhook
      summary: Paystack webhook receiver
      description: |
        Configure this URL in the Paystack dashboard. Authenticated by `x-paystack-signature`
        (HMAC-SHA512 of the raw body with your secret key). Handles `charge.success`, `transfer.success`,
        `transfer.failed` and `transfer.reversed`; other events and unknown references are acknowledged and ignored.
        Duplicate deliveries are idempotent.
      security: []
      parameters: [{ name: x-paystack-signature, in: header, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { event: { type: string, example: charge.success }, data: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: Acknowledged, content: { application/json: { schema: { type: object, properties: { received: { type: boolean } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { description: Bad signature (`INVALID_SIGNATURE`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Source IP not whitelisted (when enforced), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

