  # ======================================================================== Bets
  /sports/bets:
    post:
      tags: [Bets]
      operationId: placeBet
      summary: Place a single or accumulator bet
      description: |
        * Pre-match only; one selection per match; max `MAX_SELECTIONS` legs; payout capped at `MAX_PAYOUT`.
        * Send each `price` you displayed. On movement you get **409 `ODDS_CHANGED`** with `details.changes`
          (unless `acceptOddsChanges` allows it).
        * Send `Idempotency-Key` so a retried request returns the original slip (200) instead of betting twice.
      parameters:
        - { name: Idempotency-Key, in: header, schema: { type: string, maxLength: 100 }, example: 6f1c2e1a-slip-42 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceBetRequest' }
            examples:
              single: { summary: Single, value: { stake: 1000, selections: [{ oddsId: 146, price: 1.75 }] } }
              accumulator: { summary: Accumulator, value: { stake: 500, selections: [{ oddsId: 146, price: 1.75 }, { oddsId: 212, price: 1.9 }, { oddsId: 305, price: 1.8 }], acceptOddsChanges: higher } }
      responses:
        '201': { description: Placed, content: { application/json: { schema: { $ref: '#/components/schemas/BetSlip' } } } }
        '200': { description: Idempotent replay — the slip created by an earlier request with the same key, content: { application/json: { schema: { $ref: '#/components/schemas/BetSlip' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Odds changed or selections unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                oddsChanged: { value: { error: { code: ODDS_CHANGED, message: Odds have changed, details: { changes: [{ oddsId: 146, requested: 1.75, current: '1.700' }] } } } }
                unavailable: { value: { error: { code: SELECTIONS_UNAVAILABLE, message: Some selections are no longer available, details: { oddsIds: [146] } } } }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Bets]
      operationId: listMyBets
      summary: My bets (newest first)
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, won, lost, void, cashed_out] } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { description: Bets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BetSlip' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /sports/bets/{id}:
    get:
      tags: [Bets]
      operationId: getBet
      summary: One of my bets
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Bet, content: { application/json: { schema: { $ref: '#/components/schemas/BetSlip' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /sports/bets/{id}/cashout:
    get:
      tags: [Bets]
      operationId: cashoutQuote
      summary: Current cash-out offer
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Quote, content: { application/json: { schema: { $ref: '#/components/schemas/CashoutQuote' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Bets]
      operationId: cashout
      summary: Cash out a pending bet
      parameters: [{ $ref: '#/components/parameters/id' }]
