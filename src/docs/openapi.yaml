      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [kycStatus], properties: { kycStatus: { type: string, enum: [unverified, pending, verified, rejected] }, note: { type: string } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
