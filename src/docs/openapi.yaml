        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sportId, slug, name]
              properties:
                sportId: { type: integer, example: 1 }
                slug: { type: string, example: caf-champions-league }
                name: { type: string, example: CAF Champions League }
                shortName: { type: string }
                country: { type: string, example: Africa }
                countryCode: { type: string, minLength: 2, maxLength: 2 }
                providerSlug: { type: string, description: League id at odds-api.io }
                syncEnabled: { type: boolean }
                isFeatured: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLeague' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/leagues/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateLeague
      summary: Update a league (e.g. set providerSlug and enable feed sync)
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                shortName: { type: string }
                providerSlug: { type: string, nullable: true, example: england-premier-league }
                syncEnabled: { type: boolean }
                isFeatured: { type: boolean }
                isActive: { type: boolean }
                sortOrder: { type: integer }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/AdminLeague' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/events:
    get:
      tags: [Admin]
      operationId: adminListEvents
      summary: Events with settlement status
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [scheduled, live, finished, cancelled, postponed] } }
        - { name: league, in: query, schema: { type: string } }
        - { name: needsResult, in: query, description: Started/finished events still awaiting a result, schema: { type: boolean } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { description: Events, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminEvent' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin]
      operationId: adminCreateEvent
      summary: Create a fixture (optionally with markets and odds)
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateEventRequest' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/EventDetail' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/events/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateEvent
      summary: Reschedule, postpone or feature a fixture
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UpdateEventRequest' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/EventDetail' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/events/{id}/result:
    post:
      tags: [Admin]
      operationId: adminRecordResult
      summary: Record the final score and auto-settle all supported markets
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResultRequest' } } }
      responses:
        '200': { description: Settlement summary, content: { application/json: { schema: { $ref: '#/components/schemas/ResultSummary' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Not started yet, cancelled, or already settled', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/events/{id}/cancel:
    post:
      tags: [Admin]
      operationId: adminCancelEvent
      summary: Cancel/abandon — void every market and refund/recompute slips
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, example: Match abandoned (waterlogged pitch) } } } } }
      responses:
        '200': { description: Cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/CancelEventResult' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/events/{id}/markets:
    post:
      tags: [Admin]
      operationId: adminAddMarket
      summary: Add a market to an upcoming fixture
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MarketInput' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { marketId: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/markets/{id}/suspend:
    post:
      tags: [Admin]
      operationId: adminSuspendMarket
      summary: Stop betting on a market
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Suspended, content: { application/json: { schema: { type: object, properties: { marketId: { type: integer }, status: { type: string } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/markets/{id}/reopen:
    post:
      tags: [Admin]
      operationId: adminReopenMarket
      summary: Reopen a suspended market (upcoming events only)
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Reopened, content: { application/json: { schema: { type: object, properties: { marketId: { type: integer }, status: { type: string } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/markets/{id}/settle:
    post:
      tags: [Admin]
      operationId: adminSettleMarket
      summary: Manually settle one market
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettleMarketRequest' }
            examples:
              winner: { value: { winningSelection: HOME } }
              perSelection: { value: { results: { OVER: void, UNDER: void } } }
              void: { value: { voidMarket: true } }
      responses:
        '200': { description: Settled, content: { application/json: { schema: { $ref: '#/components/schemas/MarketSettlementSummary' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/markets/{id}/odds:
    post:
      tags: [Admin]
      operationId: adminAddOdds
      summary: Add a selection to a market
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [selection, price], properties: { selection: { type: string, example: '3-1' }, price: { type: number, example: 15 } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/OddsRow' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/odds/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateOdds
      summary: Change a price or (de)activate a selection
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, minProperties: 1, properties: { price: { type: number, minimum: 1.01, example: 2.2 }, isActive: { type: boolean } } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/OddsRow' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/odds-sync:
    post:
      tags: [Admin]
      operationId: adminSyncOdds
      summary: Pull fixtures and prices from odds-api.io now
      requestBody:
        content: { application/json: { schema: { type: object, properties: { leagues: { type: array, items: { type: string }, example: [premier-league, la-liga, npfl] } } } } }
      responses:
        '200': { description: Per-league summary, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/OddsSyncSummary' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/odds-provider/leagues:
    get:
      tags: [Admin]
      operationId: adminProviderLeagues
      summary: Discover the provider's league ids (for providerSlug)
      parameters: [{ name: sport, in: query, schema: { type: string, default: football } }]
      responses:
        '200': { description: Provider leagues, content: { application/json: { schema: { type: array, items: { type: object, properties: { slug: { type: string }, name: { type: string }, country: { type: string, nullable: true } } } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503': { description: Odds feed not configured (`ODDS_FEED_DISABLED`), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/bets:
    get:
      tags: [Admin]
      operationId: adminListBets
      summary: Search bets
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, won, lost, void, cashed_out] } }
        - { name: userId, in: query, schema: { type: integer } }
        - { name: eventId, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { description: Bets, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminBet' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/withdrawals:
    get:
      tags: [Admin]
      operationId: adminListWithdrawals
      summary: Withdrawal queue
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending_review, approved, processing, success, failed, reversed, rejected] } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { description: Withdrawals, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AdminWithdrawal' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/withdrawals/{id}/approve:
    post:
      tags: [Admin]
      operationId: adminApproveWithdrawal
      summary: Approve and send to Paystack
      parameters: [{ $ref: '#/components/parameters/id' }]
      responses:
        '200': { description: Approved (now processing), content: { application/json: { schema: { $ref: '#/components/schemas/AdminWithdrawal' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/withdrawals/{id}/reject:
    post:
      tags: [Admin]
      operationId: adminRejectWithdrawal
      summary: Reject and refund
      parameters: [{ $ref: '#/components/parameters/id' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, example: Source of funds check failed } } } } }
      responses:
        '200': { description: Rejected, content: { application/json: { schema: { $ref: '#/components/schemas/AdminWithdrawal' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/reports/summary:
    get:
      tags: [Admin]
      operationId: adminSummaryReport
      summary: GGR, payments and users for a window (default last 30 days)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Report, content: { application/json: { schema: { $ref: '#/components/schemas/SummaryReport' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reports/liability:
    get:
      tags: [Admin]
      operationId: adminLiabilityReport
      summary: Open exposure per selection (largest first)
      parameters:
        - { name: eventId, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { description: Exposure rows, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/LiabilityRow' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: adminAuditLogs
      summary: Audit trail of privileged actions
      parameters:
        - { name: action, in: query, schema: { type: string }, example: withdrawal.approve }
        - { name: entityType, in: query, schema: { type: string } }
        - { name: entityId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AuditLog' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ======================================================================== Operations (root paths)
  /health:
    get:
      tags: [Operations]
      operationId: health
      summary: Liveness probe
      security: []
      servers: [{ url: / }]
      responses:
        '200': { description: Process is up, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [ok] }, uptime: { type: number } } } } } }
  /ready:
    get:
      tags: [Operations]
      operationId: ready
      summary: Readiness probe (checks PostgreSQL)
      security: []
      servers: [{ url: / }]
      responses:
        '200': { description: Ready, content: { application/json: { schema: { type: object, properties: { status: { type: string }, database: { type: boolean } } } } } }
        '503': { description: Database unavailable }
  /metrics:
    get:
      tags: [Operations]
      operationId: metrics
      summary: Prometheus metrics
      description: "Requires `Authorization: Bearer <METRICS_TOKEN>` when METRICS_TOKEN is set."
      security: []
      servers: [{ url: / }]
      responses:
        '200': { description: Prometheus text format, content: { text/plain: { schema: { type: string } } } }
        '401': { description: Missing/invalid metrics token }
