# Production override used by the CD pipeline on the deploy host:
#
#   IMAGE=ghcr.io/<owner>/<repo>:<tag> docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pulls the pre-built image from GHCR instead of building, keeps Postgres
# off the public interface, and runs two API replicas behind your reverse
# proxy (nginx / Caddy / a cloud LB terminating TLS).
services:
  db:
    ports: !reset []

  migrate:
    build: !reset null
    pull_policy: always

  api:
    build: !reset null
    pull_policy: always
    ports: !reset []
    expose:
      - '4000'
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M

  worker:
    build: !reset null
    pull_policy: always
    deploy:
      replicas: 1

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api

volumes:
  caddy_data:
